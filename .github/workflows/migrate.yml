# Migrações Alembic do Mplacas (ADR-076).
#
# Substitui o Cloud Run Job `mplacas-migrate`. Mantém a regra das ADRs anteriores:
# migração é executada explicitamente, NUNCA no startup do serviço web. Por isso
# este workflow só roda por acionamento manual — não há gatilho por push.
#
# Usa o endpoint DIRETO (não-pooled), recomendado pelo Neon para migrações de
# schema e livre das limitações de sessão do PgBouncer. Guarde essa URL no
# secret MPLACAS_MIGRATION_DATABASE_URL, separado do
# MPLACAS_DATABASE_URL (pooled) que o runtime e os jobs diários usam.
name: migrate

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite MIGRAR para confirmar a execução contra produção"
        required: true
        default: ""

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alembic-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Exigir confirmacao explicita
        if: inputs.confirmacao != 'MIGRAR'
        run: |
          echo "Confirmação ausente ou incorreta. Digite exatamente MIGRAR." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Alembic upgrade head
        env:
          MPLACAS_ENVIRONMENT: production
          # Endpoint direto, não o pooled.
          MPLACAS_DATABASE_URL: ${{ secrets.MPLACAS_MIGRATION_DATABASE_URL }}
          MPLACAS_OPERATIONS_API_KEY: ${{ secrets.MPLACAS_OPERATIONS_API_KEY }}
        run: python -m mplacas.cloud_jobs migrate
