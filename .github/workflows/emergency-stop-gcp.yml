name: Emergency Stop MPlacas GCP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-stop-gcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  emergency-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: mplacas
      GCP_REGION: us-central1

    steps:
      - uses: actions/checkout@v4

      - name: Detect available GCP authentication
        id: auth
        shell: bash
        env:
          JSON_CREDS: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$JSON_CREDS" ]]; then
            echo "mode=json" >> "$GITHUB_OUTPUT"
          elif [[ -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with service-account JSON
        if: steps.auth.outputs.mode == 'json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS }}

      - name: Authenticate with Workload Identity Federation
        if: steps.auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}

      - name: Stop if no GCP credential is configured
        if: steps.auth.outputs.mode == 'none'
        shell: bash
        run: |
          echo "No supported GCP authentication secret is configured in this repository." >&2
          exit 2

      - name: Set up gcloud
        if: steps.auth.outputs.mode != 'none'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact target project
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GCP_PROJECT_ID" == "mplacas" ]] || exit 10
          gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectId)' | grep -Fx "$GCP_PROJECT_ID"
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set run/region "$GCP_REGION"

      - name: Delete all MPlacas Cloud Scheduler jobs
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t jobs < <(
            gcloud scheduler jobs list \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --format='value(name)' 2>/dev/null \
            | awk -F/ '{print $NF}' \
            | grep '^mplacas' || true
          )
          for job in "${jobs[@]}"; do
            echo "Deleting scheduler job: $job"
            gcloud scheduler jobs delete "$job" \
              --location="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          done

      - name: Delete all MPlacas Cloud Run jobs
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t jobs < <(
            gcloud run jobs list \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --format='value(metadata.name)' \
            | grep '^mplacas' || true
          )
          for job in "${jobs[@]}"; do
            echo "Deleting Cloud Run job: $job"
            gcloud run jobs delete "$job" \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          done

      - name: Delete all MPlacas Cloud Run services
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t services < <(
            gcloud run services list \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --format='value(metadata.name)' \
            | grep '^mplacas' || true
          )
          for service in "${services[@]}"; do
            echo "Deleting Cloud Run service: $service"
            gcloud run services delete "$service" \
              --region="$GCP_REGION" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          done

      - name: Remove MPlacas managed monitoring policies
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t policies < <(
            gcloud monitoring policies list \
              --project="$GCP_PROJECT_ID" \
              --format='value(name,userLabels.mplacas_policy_id)' \
            | awk '$2 != "" {print $1}' || true
          )
          for policy in "${policies[@]}"; do
            echo "Deleting monitoring policy: $policy"
            gcloud monitoring policies delete "$policy" \
              --project="$GCP_PROJECT_ID" \
              --quiet
          done

      - name: Verify runtime is stopped
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        run: |
          set -Eeuo pipefail
          services="$(gcloud run services list --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(metadata.name)' | grep '^mplacas' || true)"
          run_jobs="$(gcloud run jobs list --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(metadata.name)' | grep '^mplacas' || true)"
          scheduler_jobs="$(gcloud scheduler jobs list --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null | grep '/mplacas' || true)"

          if [[ -n "$services" || -n "$run_jobs" || -n "$scheduler_jobs" ]]; then
            echo "Emergency stop verification FAILED." >&2
            printf 'services:\n%s\nrun jobs:\n%s\nscheduler jobs:\n%s\n' "$services" "$run_jobs" "$scheduler_jobs" >&2
            exit 20
          fi

          echo "MPLACAS_GCP_RUNTIME_STOPPED=true"
          echo "Cloud Run services: 0"
          echo "Cloud Run jobs: 0"
          echo "Cloud Scheduler jobs: 0"
          echo "Secret Manager, Artifact Registry, project and external database were preserved."
