name: Encrypted backup and restore drill

# Agenda restaurada em 2026-08-27 (auditoria, achado A-03). Ela havia sido
# desativada em 2026-08-25 durante o incidente de cota do Neon, junto com a
# política de "workstation production" — que caiu com a adoção do Render.
#
# As 4 falhas de 22 a 25/08 NÃO foram defeito deste workflow: o log mostra
# `pg_dump: ... exceeded the compute time quota`, ou seja, o backup foi vítima
# do mesmo incidente que ele existia para proteger.
#
# Custo medido antes de religar: o dump de 2026-08-21 tem 60 KB. Uma execução
# diária acorda o Neon por ~6 min (dump + autosuspend de 5 min), ~3 h/mês, cerca
# de 0,75 CU-hora de 100. O que estourou a cota em 21/08 foi outra coisa: jobs a
# cada 5 minutos mantendo o banco acordado 24 h por dia.
on:
  schedule:
    # 07:00 no fuso da operação, DEPOIS do ciclo operacional das 06:07 (que tem
    # timeout de 30 min). Antes a agenda era 05:00 UTC = 02:00 local, e o
    # snapshot saía sem o processamento daquela manhã. Rodar na sequência também
    # aproveita o Neon já acordado, em vez de despertá-lo duas vezes.
    - cron: "0 7 * * *"
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    environment: production-restore-drill
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: mplacas_restore_check
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mplacas_restore_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MPLACAS_BACKUP_SOURCE_URL: ${{ secrets.MPLACAS_BACKUP_SOURCE_URL }}
      MPLACAS_RESTORE_DATABASE_URL: postgresql://postgres@localhost:5432/mplacas_restore_check
      MPLACAS_RESTORE_CONFIRM_HOST: localhost
      MPLACAS_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.MPLACAS_BACKUP_ENCRYPTION_PASSPHRASE }}
      MPLACAS_RESTORE_DRILL_OWNER: ${{ vars.MPLACAS_RESTORE_DRILL_OWNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client and application
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          pgdg_key="$(mktemp)"
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$pgdg_key"
          test "$(gpg --show-keys --with-colons "$pgdg_key" | awk -F: '$1 == "fpr" {print $10; exit}')" = \
            "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo gpg --batch --yes --dearmor \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg \
            "$pgdg_key"
          rm -f "$pgdg_key"
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Execute encrypted backup and restore drill
        id: drill
        run: bash infra/backup/run-restore-drill.sh
      - name: Upload encrypted backup and audit manifest
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-${{ github.run_id }}
          path: artifacts/restore-drill/
          if-no-files-found: error
          retention-days: 35
      - name: Open deduplicated restore incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[P1-06] Restore drill failure"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "$title" \
              --body "The manual restore drill failed. Inspect the redacted workflow logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue comment "$existing" \
              --body "Manual restore drill failed again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
