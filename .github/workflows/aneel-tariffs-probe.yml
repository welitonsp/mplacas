# Sonda da base aberta de tarifas da ANEEL (ADR-088, preparação). Só lê dado
# público e imprime um resumo como anotação; não usa segredo nem banco.
name: aneel-tariffs-probe

on:
  pull_request:
    paths:
      - scripts/aneel_tariffs_probe.py
      - .github/workflows/aneel-tariffs-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Sondar base da ANEEL
        run: python scripts/aneel_tariffs_probe.py
