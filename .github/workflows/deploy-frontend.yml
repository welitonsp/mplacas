name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# Cloudflare Pages faz parte da arquitetura gratuita. Este workflow não usa
# nem reativa qualquer recurso do Google Cloud.

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ADR-102: o frontend chama sempre `/api` (mesma origem) e a Pages Function
      # em `functions/api/[[path]].ts` repassa ao Render. A origem da API e o
      # segredo do proxy NÃO passam por aqui: são variáveis do próprio projeto
      # no Cloudflare Pages (MPLACAS_API_ORIGIN, MPLACAS_PROXY_SHARED_SECRET),
      # lidas pela Function em tempo de execução. `VITE_API_URL` deixou de ser
      # usada no build (o build falha se ela estiver no ambiente); a variável do
      # GitHub continua existindo só para o `watchdog.yml`.
      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Required configuration is missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      # `wrangler pages deploy dist` só envia Functions da pasta `functions/` do
      # diretório atual (aqui, `frontend/`). Compilar antes faz o deploy falhar
      # se a Function quebrar, em vez de publicar o site sem o proxy `/api`.
      - name: Compile Pages Function
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -f "functions/api/[[path]].ts"
          test -f dist/_routes.json
          npx wrangler pages functions build --outdir "$RUNNER_TEMP/pages-functions" --output-routes-path "$RUNNER_TEMP/pages-functions-routes.json"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist
          --project-name=mplacas-frontend
          --branch=main

      # Confere o proxy publicado. A troca do domínio de produção para o deploy
      # novo leva alguns segundos: até lá o deploy antigo responde (index.html
      # com 200 em GET e 405 em POST). Por isso só vale um 200 com JSON da API.
      # 503 = Function sem MPLACAS_API_ORIGIN ([vars] do wrangler.toml) ou sem o
      # segredo MPLACAS_PROXY_SHARED_SECRET (painel do Pages, Production);
      # 502/504 = Render fora ou acordando. Repete porque o plano grátis hiberna.
      - name: Smoke test do proxy /api
        run: |
          for tentativa in $(seq 1 12); do
            resposta=$(curl -s -D - -o /dev/null --max-time 90 https://mplacas-frontend.pages.dev/api/health || true)
            status=$(printf '%s' "$resposta" | awk 'NR==1{print $2}')
            tipo=$(printf '%s' "$resposta" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')
            echo "tentativa $tentativa: HTTP $status ($tipo)"
            case "$status:$tipo" in
              200:application/json*) exit 0 ;;
              503:application/json*)
                echo "Proxy sem configuração: MPLACAS_API_ORIGIN em [vars] do frontend/wrangler.toml e o segredo MPLACAS_PROXY_SHARED_SECRET (Production) no Cloudflare Pages." >&2
                exit 1 ;;
            esac
            sleep 15
          done
          echo "A API não respondeu pelo proxy /api." >&2
          exit 1

      # Confere a defesa CSRF de ponta a ponta pelo proxy. O backend só aplica a
      # checagem de Origin/X-Mplacas-Auth quando há cookie (auth/router.py,
      # refresh): sem cookie, qualquer Origin daria 401 e o teste não provaria
      # nada. Por isso vai um cookie com token inválido (desconhecido: não
      # revoga nada). Esperado 401 = Origin aceito e token recusado. 403 = a
      # origem do Pages não está em MPLACAS_CORS_ALLOWED_ORIGINS no Render (ou o
      # proxy não repassa Origin/Cookie) — todo login de navegador falharia.
      - name: Smoke test do refresh pelo proxy (CSRF/Origin)
        run: |
          for tentativa in $(seq 1 8); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -X POST \
              -H 'Origin: https://mplacas-frontend.pages.dev' \
              -H 'X-Mplacas-Auth: 1' \
              -H 'Cookie: __Secure-mplacas_rt=smoke-invalido' \
              https://mplacas-frontend.pages.dev/api/auth/refresh || true)
            echo "POST /api/auth/refresh com cookie inválido: HTTP $status (esperado 401)"
            # 405 = ainda é o deploy antigo (estático); espera a troca.
            [ "$status" = "405" ] || break
            sleep 15
          done
          case "$status" in
            401) exit 0 ;;
            403) echo "403: a origem https://mplacas-frontend.pages.dev não está em MPLACAS_CORS_ALLOWED_ORIGINS no Render. Login pelo navegador vai falhar." >&2; exit 1 ;;
            503) echo "503: Pages Function sem MPLACAS_API_ORIGIN/MPLACAS_PROXY_SHARED_SECRET." >&2; exit 1 ;;
            *) echo "Resposta inesperada do refresh pelo proxy." >&2; exit 1 ;;
          esac
