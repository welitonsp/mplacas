version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init e analyze do CodeQL precisam da MESMA versão: PRs separados
      # falham os dois (versão do arquivo de configuração ≠ versão em execução).
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # A imagem fica no Python 3.12 de propósito: é a versão do lock com
      # hashes, do CI (setup-python 3.12), do mypy e do contrato do contêiner
      # (tests/test_container_contract.py). Trocar de versão do Python é
      # decisão deliberada, não atualização automática — só digest/patch.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
