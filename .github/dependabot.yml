version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init e analyze do CodeQL precisam da MESMA versão: PRs separados
      # falham os dois (versão do arquivo de configuração ≠ versão em execução).
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
