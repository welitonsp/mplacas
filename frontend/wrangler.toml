# Cloudflare Pages configuration
# Deploy: npx wrangler pages deploy dist --project-name=mplacas-frontend
#
# Pages Function (ADR-102): `functions/api/[[path]].ts` repassa `/api/*` à API
# no Render. `wrangler pages deploy` só envia `functions/` do diretório atual —
# rode o deploy de dentro de `frontend/` (o workflow já faz isso).
#
# Variáveis do projeto no Cloudflare Pages (Settings → Variables and Secrets,
# ambiente Production), lidas pela Function em tempo de execução:
#   MPLACAS_API_ORIGIN           — origem https exata da API (sem caminho)
#   MPLACAS_PROXY_SHARED_SECRET  — secret, ≥ 32 bytes, mesmo valor do Render
# Faltando qualquer uma, `/api/*` responde 503 (falha fechada).
#
# GitHub (deploy-frontend.yml):
#   CLOUDFLARE_ACCOUNT_ID (variable), CLOUDFLARE_API_TOKEN (secret, Pages:Edit)
# VITE_API_URL não é mais usada no build (o build falha se estiver definida).
#
# Backend: MPLACAS_CORS_ALLOWED_ORIGINS precisa conter a origem exata do Pages.

name = "mplacas-frontend"
pages_build_output_dir = "dist"
