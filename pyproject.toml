[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mplacas"
version = "0.5.0"
description = "Plataforma de inteligência, auditoria e gestão energética residencial"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  # Piso 6.21.2: corrige CVE-2026-115572/115580/115585 (pypdf processa faturas
  # recebidas de clientes; antes, 6.19.0 para PYSEC-2026-4153..4160).
  "pypdf>=6.21.2,<7",
  "reportlab>=4.4,<6",
  "xlsxwriter>=3.2,<4",
  # Piso 2.15: corrige PYSEC-2026-4140..4152 e 4183 (assina os tokens de acesso).
  "pyjwt>=2.15,<3",
  "argon2-cffi>=23.1,<26",
  # Cifra as senhas dos fabricantes de inversor (AES-256-GCM, ADR-091).
  "cryptography>=50.0,<51",
  "tzdata>=2025.2",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
  "opentelemetry-instrumentation-httpx>=0.65b0,<1",
]

[project.optional-dependencies]
# Exportador OTLP: extra opcional, instalado apenas quando houver um backend de
# observabilidade configurado (MPLACAS_OTLP_ENDPOINT). Fora do lock de runtime
# de proposito — o projeto roda sem nenhum backend de tracing/metricas.
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
dev = [
  "editables==0.6",
  "hatchling>=1.27,<2",
  "pip-tools==7.6.2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "types-reportlab>=4.5.1.20260712,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mplacas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Só a suíte do projeto. Sem isto, `pytest` na raiz recolheria qualquer
# `test_*.py` do repositório — inclusive código de terceiros em
# `.claude/skills/` (skills instaladas, ver PR #211).
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres_integration: requires MPLACAS_TEST_POSTGRES_URL and a migrated PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Skills de terceiros instaladas em `.claude/skills/` (ex.: ui-ux-pro-max,
# MIT) trazem scripts próprios, que não são código do projeto nem seguem o
# estilo dele. Ficam fora do lint em vez de serem reescritos.
extend-exclude = [".claude"]

[tool.ruff.lint]
# `E` = pycodestyle (estilo). `F` = Pyflakes, que pega defeito de verdade:
# import morto, variável atribuída e nunca usada, e principalmente F821 (nome
# indefinido), que é erro de execução esperando acontecer.
#
# `F` ficou desligado até 2026-08-27 (auditoria, achado A-08). Dois imports
# mortos sobreviveram a várias rodadas de CI verde e só foram encontrados por
# revisão manual — a rede de proteção estava mais fraca do que aparentava.
#
# Desde 2026-10-12, três regras pontuais (não as famílias inteiras), com todas
# as ocorrências já corrigidas:
# - `B904`: `raise` dentro de `except` declara a causa (`from exc`/`from None`),
#   em vez de parecer um segundo erro acidental durante o tratamento.
# - `UP017`: `datetime.UTC` em vez de `timezone.utc` (Python 3.11+).
# - `UP035`: `collections.abc` em vez de aliases obsoletos de `typing`.
select = ["E", "F", "B904", "UP017", "UP035"]

[tool.mypy]
python_version = "3.12"
packages = ["mplacas"]
mypy_path = "typings"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Extra opcional `mplacas[otlp]`, deliberadamente fora do lock: o projeto roda
# sem backend de observabilidade. Os imports em observability/tracing.py e
# observability/metrics.py sao preguicosos e so executam quando
# MPLACAS_OTLP_ENDPOINT esta configurado.
module = ["opentelemetry.exporter.otlp.*"]
ignore_missing_imports = true
